name: Test Hello World Scala

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Scala
      use: coursier/setup-scala@v1
      with:
        java-version: 11
        scala-version: 2.13.10
    - name: Compile and run HelloWorld
      run: |
        scalac HelloWorld.scala
        scala HelloWorld
    - name: Verify output
      run: |
        output=$(scala HelloWorld)
        if [ "$output" = "Hello, World!" ]; then
          echo "Output matches expected"
        else
          echo "Expected 'Hello, World!' but got '$output'"
          exit 1
        fi