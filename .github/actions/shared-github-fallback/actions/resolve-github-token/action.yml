name: Resolve optional GitHub credentials
description: Compatibility contract for link-foundation/.github issue 1, replaced by upstream when published
inputs:
  app-id:
    description: Optional GitHub App ID
    default: ''
  app-private-key:
    description: Optional GitHub App private key
    default: ''
  token:
    description: Optional single automation token
    default: ''
  default-token:
    description: Built-in GitHub token
    required: true
  permissions:
    description: Explicit GitHub App permissions for the current job
    default: '{"contents":"read"}'
outputs:
  token:
    description: Resolved credential
    value: ${{ steps.resolve.outputs.token }}
  layer:
    description: app, token, or default
    value: ${{ steps.resolve.outputs.layer }}
  triggers-workflows:
    description: Whether ordinary events start checks without approval
    value: ${{ steps.resolve.outputs.triggers-workflows }}
  can-create-repositories:
    description: Whether repository creation capability was verified
    value: ${{ steps.resolve.outputs.can-create-repositories }}
runs:
  using: composite
  steps:
    - id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: ${{ fromJSON(inputs.permissions).contents }}
        permission-issues: ${{ fromJSON(inputs.permissions).issues }}
        permission-pull-requests: ${{ fromJSON(inputs.permissions).pull_requests }}
        permission-actions: ${{ fromJSON(inputs.permissions).actions }}
        permission-checks: ${{ fromJSON(inputs.permissions).checks }}
        permission-security-events: ${{ fromJSON(inputs.permissions).security_events }}
        permission-packages: ${{ fromJSON(inputs.permissions).packages }}
        permission-pages: ${{ fromJSON(inputs.permissions).pages }}
        permission-workflows: ${{ fromJSON(inputs.permissions).workflows }}
    - id: resolve
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        APP_TOKEN: ${{ steps.app.outputs.token }}
        AUTOMATION_TOKEN: ${{ inputs.token }}
        DEFAULT_TOKEN: ${{ inputs.default-token }}
      run: node "$ACTION_PATH/resolve.mjs"
