name: Workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '**.sh'
      - '.husky/**'
  pull_request:
    branches-ignore: ['e2e/**']
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '**.sh'
      - '.husky/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Checks-only dispatch
        type: choice
        default: checks
        options: [checks]

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A native actionlint binary without shellcheck on
      # PATH silently skips the shell checks and exits 0 - worth knowing when
      # reproducing a failure locally:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # actionlint only checks the shell inside `run:` blocks. The scripts those
  # blocks call (and the git hooks) went unchecked; four warnings and errors
  # had accumulated there (issue #4025). experiments/, docs/case-studies/ and
  # dev/ hold archived research scripts that are not run by CI or users.
  # Notes and style hints (-S warning) are left to the author.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-shellcheck
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A private venv, not `pipx run`: the runner image ships its own
      # shellcheck, and pipx then prints "shellcheck is already on your PATH"
      # on every run (issue #4029). Calling the venv binary by path keeps the
      # pinned release and prints its version as evidence.
      - name: Check standalone shell scripts and hooks
        run: |
          python3 -m venv "$RUNNER_TEMP/shellcheck"
          "$RUNNER_TEMP/shellcheck/bin/pip" install --quiet --disable-pip-version-check shellcheck-py==0.11.0.1
          "$RUNNER_TEMP/shellcheck/bin/shellcheck" --version
          git ls-files -z '*.sh' '.husky/*' ':!:experiments/**' ':!:docs/case-studies/**' ':!:dev/**' \
            | xargs -0 "$RUNNER_TEMP/shellcheck/bin/shellcheck" -S warning

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Annotations instead of SARIF: code scanning is not enabled on every
      # fork of this repository, and the job should fail loudly either way.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: medium

  # GitHub reports a job killed by timeout-minutes as cancelled, which leaves
  # the run grey instead of red. Fail on any failure, and on any cancellation
  # that a newer commit on the same ref does not explain (issue #4025; the
  # jobs above cancel superseded runs on every ref, main included).
  pipeline-status:
    name: Workflows Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - actionlint
      - shellcheck
      - zizmor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fail the run when a job failed or timed out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
