# Runs Main.scala on every push and pull request with the commands the
# change was verified with.
name: Run Main.scala

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3  # v3.0.4
        with:
          jvm: temurin:25
          apps: scala:3.10.0 scalac:3.10.0
      - run: |
          sh tests/verify-output.sh
