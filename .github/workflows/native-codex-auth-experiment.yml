name: Native Codex auth adapter experiment

on:
  pull_request:
    paths:
      - 'experiments/issue-3785/native-codex/**'
      - 'experiments/issue-3785/probe-codex-native-auth-root.mjs'
      - 'experiments/issue-3785/probe-codex-native-manager.mjs'
      - 'experiments/issue-3785/probe-codex-native-request-auth.mjs'
      - 'experiments/issue-3785/probe-codex-native-maintenance.mjs'
      - 'experiments/issue-3785/probe-codex-native-message-history.mjs'
      - 'experiments/issue-3785/probe-codex-native-rollout-recovery.mjs'
      - 'src/codex-sessions.lib.mjs'
      - 'src/codex-rollout-publication.lib.mjs'
      - 'src/session-kill-resume.fresh-session.lib.mjs'
      - '.github/workflows/native-codex-auth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codex-auth-experiment-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install branch dependencies and the exact native Linux CLI
        run: |
          npm ci --ignore-scripts > "$RUNNER_TEMP/history-dependencies.log" 2>&1 &
          wait "$!"
          npm ci --prefix experiments/issue-3785/native-codex/stock-cli --ignore-scripts --no-audit --no-fund >> "$RUNNER_TEMP/history-dependencies.log" 2>&1 &
          wait "$!"
          echo "CODEX_PROBE_BINARY=$GITHUB_WORKSPACE/experiments/issue-3785/native-codex/stock-cli/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex" >> "$GITHUB_ENV"
          echo "CODEX_PROBE_DIAGNOSTIC_FILE=$RUNNER_TEMP/native-history-process.log" >> "$GITHUB_ENV"
      - name: Verify native cross-scope writer ownership and archive lifecycle
        run: node experiments/issue-3785/probe-codex-native-rollout-recovery.mjs --history-scopes > "$RUNNER_TEMP/native-history-scopes.log" 2>&1
      - name: Verify native formats through stopped-container recovery
        run: node experiments/issue-3785/probe-codex-native-rollout-recovery.mjs > "$RUNNER_TEMP/native-history-recovery.log" 2>&1
      - name: Reproduce private native thread metadata with and without shared SQLite
        run: |
          node experiments/issue-3785/probe-codex-native-rollout-recovery.mjs --history-metadata --expect-private-metadata > "$RUNNER_TEMP/native-history-metadata-before.log" 2>&1
          node experiments/issue-3785/probe-codex-native-rollout-recovery.mjs --history-metadata --shared-sqlite --expect-private-metadata > "$RUNNER_TEMP/native-history-metadata-sqlite-before.log" 2>&1
      - name: Reproduce stale authorization in actual stock-native model requests
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$CODEX_PROBE_BINARY" --expect-uncoordinated > "$RUNNER_TEMP/native-history-request-before.log" 2>&1
      - name: Preserve native history diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-codex-history
          path: |
            ${{ runner.temp }}/history-dependencies.log
            ${{ runner.temp }}/native-history-*.log
          retention-days: 7
  native-file-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Fetch the immutable supported native source
        run: |
          native_source="$RUNNER_TEMP/codex-native-source"
          echo "NATIVE_SOURCE=$native_source" >> "$GITHUB_ENV"
          git init "$native_source"
          git -C "$native_source" remote add origin https://github.com/openai/codex.git
          node scripts/github-retry.mjs git -C "$native_source" fetch --depth 1 origin 6aaac694803004a63c6f393d153c96d22521a6b9
          git -C "$native_source" checkout --detach FETCH_HEAD
          python3 experiments/issue-3785/native-codex/apply_adapter.py "$native_source"
          python3 experiments/issue-3785/native-codex/apply_message_history_probe.py "$native_source"
      - name: Install the source-pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test the exact canonical storage module
        run: |
          rustc +1.99.1 --edition 2024 --test experiments/issue-3785/native-codex/canonical_auth_tests.rs -o "$RUNNER_TEMP/canonical-auth-tests"
          prlimit --data=134217728 --stack=8388608 --core=0 -- "$RUNNER_TEMP/canonical-auth-tests" --test-threads=1
      - name: Test the exact canonical session index module
        run: |
          rustc +1.99.1 --edition 2024 --test experiments/issue-3785/native-codex/canonical_session_index.rs -o "$RUNNER_TEMP/canonical-session-index-tests"
          prlimit --data=134217728 --stack=8388608 --core=0 -- "$RUNNER_TEMP/canonical-session-index-tests" --test-threads=1
      - name: Install native Linux build prerequisites
        run: |
          {
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          } > "$RUNNER_TEMP/native-prerequisites.log" 2>&1 &
          wait "$!"
      - name: Build the real native manager before coordination
        run: |
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-login --bin hive-canonical-auth-probe > "$RUNNER_TEMP/native-codex-build.log" 2>&1
      - name: Reproduce native cached-read and refresh defects before coordination
        run: |
          for scenario in replacement logout refresh refresh-login refresh-logout; do
            node experiments/issue-3785/probe-codex-native-manager.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-canonical-auth-probe" "$scenario" --expect-uncoordinated > "$RUNNER_TEMP/native-manager-before-$scenario.log" 2>&1
          done
      - name: Apply and build the native manager coordination experiment
        run: |
          python3 experiments/issue-3785/native-codex/apply_coordination.py "$NATIVE_SOURCE"
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-login --bin hive-canonical-auth-probe >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
      - name: Verify native manager invalidation and one predecessor consumption
        run: |
          for scenario in replacement logout refresh refresh-login refresh-logout; do
            node experiments/issue-3785/probe-codex-native-manager.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-canonical-auth-probe" "$scenario" > "$RUNNER_TEMP/native-manager-after-$scenario.log" 2>&1
          done
      - name: Reproduce synchronous request-cache reads after async coordination
        run: |
          for scenario in cached-replacement cached-logout cached-malformed cached-permissions; do
            node experiments/issue-3785/probe-codex-native-manager.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-canonical-auth-probe" "$scenario" --expect-uncoordinated > "$RUNNER_TEMP/native-manager-before-$scenario.log" 2>&1
          done
      - name: Apply and build synchronous canonical reads
        run: |
          python3 experiments/issue-3785/native-codex/apply_cached_reads.py "$NATIVE_SOURCE"
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-login --bin hive-canonical-auth-probe >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
      - name: Verify synchronous reads without regressing native coordination
        run: |
          for scenario in replacement logout refresh refresh-login refresh-logout cached-replacement cached-logout cached-malformed cached-permissions; do
            node experiments/issue-3785/probe-codex-native-manager.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-canonical-auth-probe" "$scenario" > "$RUNNER_TEMP/native-manager-after-$scenario.log" 2>&1
          done
      - name: Apply the pinned canonical session index experiment
        run: python3 experiments/issue-3785/native-codex/apply_session_index.py "$NATIVE_SOURCE"
      - name: Reproduce private native maintenance ownership
        run: node experiments/issue-3785/probe-codex-native-maintenance.mjs "$NATIVE_SOURCE" --expect-private-locks > "$RUNNER_TEMP/native-maintenance-before.log" 2>&1
      - name: Apply and verify canonical native maintenance ownership
        run: |
          python3 experiments/issue-3785/native-codex/apply_maintenance.py "$NATIVE_SOURCE"
          node experiments/issue-3785/probe-codex-native-maintenance.mjs "$NATIVE_SOURCE" > "$RUNNER_TEMP/native-maintenance-after.log" 2>&1
      - name: Reproduce native private prompt history and configuration disposal loss
        run: |
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-message-history --bin hive-message-history-probe >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
          cd "$GITHUB_WORKSPACE"
          node experiments/issue-3785/probe-codex-native-message-history.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-message-history-probe" --expect-private-history > "$RUNNER_TEMP/native-prompt-history-before.log" 2>&1
      - name: Apply and verify canonical native prompt history
        run: |
          python3 experiments/issue-3785/native-codex/apply_message_history.py "$NATIVE_SOURCE"
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-message-history --bin hive-message-history-probe >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
          cd "$GITHUB_WORKSPACE"
          node experiments/issue-3785/probe-codex-native-message-history.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/hive-message-history-probe" > "$RUNNER_TEMP/native-prompt-history-after.log" 2>&1
      - name: Build the full supported CLI with the coordinated source adapter
        run: |
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-cli --bin codex >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
      - name: Verify native session index reads and mutations retain upstream behavior
        run: |
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 test --locked --profile dev-small -p codex-rollout --lib session_index:: -- --test-threads=1 > "$RUNNER_TEMP/native-session-index-tests.log" 2>&1
      - name: Verify native prompt-history upstream behavior remains intact
        run: |
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 test --locked --profile dev-small -p codex-message-history -- --test-threads=1 > "$RUNNER_TEMP/native-prompt-history-tests.log" 2>&1
      - name: Exercise native status, replacement and logout across private homes
        run: node experiments/issue-3785/probe-codex-native-auth-root.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex"
      - name: Reproduce unauthenticated model execution after canonical logout
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" --expect-unauthenticated-logout > "$RUNNER_TEMP/native-request-missing-before.log" 2>&1
      - name: Reproduce independent provider authority overrides
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" --provider-overrides --expect-provider-overrides > "$RUNNER_TEMP/native-request-overrides-before.log" 2>&1
      - name: Reproduce alternate native provider constructor authority
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" --provider-constructors --expect-provider-constructors > "$RUNNER_TEMP/native-request-constructors-before.log" 2>&1
      - name: Apply and build canonical request admission
        run: |
          python3 experiments/issue-3785/native-codex/apply_request_auth.py "$NATIVE_SOURCE"
          cd "$NATIVE_SOURCE/codex-rs"
          cargo +1.99.1 build --locked --profile dev-small -p codex-cli --bin codex >> "$RUNNER_TEMP/native-codex-build.log" 2>&1
      - name: Verify actual model requests across canonical authority changes
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" > "$RUNNER_TEMP/native-request-after.log" 2>&1
      - name: Verify provider authority overrides refuse before model execution
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" --provider-overrides > "$RUNNER_TEMP/native-request-overrides-after.log" 2>&1
      - name: Verify native provider constructors refuse alternate authority
        run: node experiments/issue-3785/probe-codex-native-request-auth.mjs "$NATIVE_SOURCE/codex-rs/target/dev-small/codex" --provider-constructors > "$RUNNER_TEMP/native-request-constructors-after.log" 2>&1
      - name: Verify named history survives disposal of both private configurations
        env:
          CODEX_PROBE_BINARY: ${{ env.NATIVE_SOURCE }}/codex-rs/target/dev-small/codex
          CODEX_PROBE_IMAGE: hive-codex-probe:0.164.0
          CODEX_PROBE_DIAGNOSTIC_FILE: ${{ runner.temp }}/native-index-process.log
        run: |
          npm ci --ignore-scripts > "$RUNNER_TEMP/native-index-dependencies.log" 2>&1 &
          wait "$!"
          docker build -t hive-codex-probe:0.164.0 -f experiments/issue-3785/native-codex/Dockerfile.runtime experiments/issue-3785/native-codex > "$RUNNER_TEMP/native-index-image.log" 2>&1
          node experiments/issue-3785/probe-codex-native-rollout-recovery.mjs --history-metadata --shared-sqlite --shared-index --shared-maintenance > "$RUNNER_TEMP/native-index-history.log" 2>&1
      - name: Preserve the experimental CLI for bounded lifecycle investigations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-codex-experimental-cli
          path: ${{ env.NATIVE_SOURCE }}/codex-rs/target/dev-small/codex
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-codex-auth-build
          path: |
            ${{ runner.temp }}/native-codex-build.log
            ${{ runner.temp }}/native-prerequisites.log
            ${{ runner.temp }}/native-manager-before-*.log
            ${{ runner.temp }}/native-manager-after-*.log
            ${{ runner.temp }}/native-request-*.log
            ${{ runner.temp }}/native-maintenance-*.log
            ${{ runner.temp }}/native-prompt-history-*.log
            ${{ runner.temp }}/native-session-index-tests.log
            ${{ runner.temp }}/native-index-*.log
          if-no-files-found: ignore
          retention-days: 7
