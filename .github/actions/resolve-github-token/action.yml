# Compatibility implementation: https://github.com/link-foundation/.github/issues/1
# The shared action does not exist yet. Keep its input/output contract so the
# callers can switch their uses: line when it is published.
name: Resolve GitHub token
description: GitHub App, one AUTOMATION_TOKEN, then the default workflow token
inputs:
  app-id:
    description: Optional GitHub App ID
    default: ''
  app-private-key:
    description: Optional GitHub App private key
    default: ''
  token:
    description: Optional AUTOMATION_TOKEN
    default: ''
  default-token:
    description: The caller's github.token
    required: true
  repository-operations:
    description: Request owner-wide Administration write for verified disposable repository operations
    default: 'false'
  owner:
    description: Owner used for the repository capability probe
    default: ${{ github.repository_owner }}
outputs:
  token:
    description: Selected token
    value: ${{ steps.resolve.outputs.token }}
  layer:
    description: app, token, or default
    value: ${{ steps.resolve.outputs.layer }}
  triggers-workflows:
    description: Whether events start workflows without approval
    value: ${{ steps.resolve.outputs.triggers-workflows }}
  can-create-repositories:
    description: Verified repository creation capability
    value: ${{ steps.resolve.outputs.can-create-repositories }}
  can-delete-repositories:
    description: Verified repository deletion capability
    value: ${{ steps.resolve.outputs.can-delete-repositories }}
runs:
  using: composite
  steps:
    - name: Mint installation token
      id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
        permission-actions: write
        permission-checks: write
        permission-workflows: write
    # Owner-wide scope is necessary only for creating/deleting disposable repositories.
    - name: Mint repository administration token
      id: admin
      if: inputs.repository-operations == 'true' && inputs.app-id != '' && inputs.app-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }} # zizmor: ignore[github-app] Explicit opt-in repository administration for cleanup and repository isolation.
        permission-administration: write
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
        permission-actions: write
        permission-checks: write
        permission-workflows: write
    - name: Resolve and report credentials
      id: resolve
      shell: bash
      env:
        RESOLVED_APP_TOKEN: ${{ steps.admin.outputs.token || steps.app.outputs.token }}
        APP_ADMINISTRATION_GRANTED: ${{ steps.admin.outputs.token != '' }}
        AUTOMATION_TOKEN: ${{ inputs.token }}
        DEFAULT_TOKEN: ${{ inputs.default-token }}
        AUTOMATION_OWNER: ${{ inputs.owner }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../../../scripts/resolve-automation-token.mjs"
