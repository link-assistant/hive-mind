        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Set version label to actual release version, not Git ref "main" (issue #1419)
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.published_version }}

