apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive-mind.fullname" . }}
  labels:
    {{- include "hive-mind.labels" . | nindent 4 }}
{{- $statePaths := list ".claude" ".codex" ".config/gh" ".config/git" ".local/share/link-assistant-agent" ".local/share/opencode" ".hive-mind" ".hive-mind-gemini-history" ".start-command" }}
{{- $environment := .Values.env | default dict }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hive-mind.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hive-mind.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hive-mind.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.persistence.enabled }}
      initContainers:
      - name: prepare-state
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        command:
        - /bin/bash
        - -ec
        - |
          umask 077
          for directory in {{ join " " $statePaths }}; do
            mkdir -p "/state/$directory"
          done
          for file in .claude/settings.json .codex/config.toml; do
            if [[ ! -e "/state/$file" && ! -L "/state/$file" && -f "/home/box/$file" ]]; then
              cp -n -- "/home/box/$file" "/state/$file"
            fi
          done
          if [[ -f /state/.claude.json && ! -L /state/.claude.json ]]; then
            cp -n -- /state/.claude.json /state/.claude/.claude.json
          elif [[ -f /home/box/.claude.json ]]; then
            cp -n -- /home/box/.claude.json /state/.claude/.claude.json
          fi
          if [[ ! -e /state/.config/git/config && -f /state/.gitconfig && ! -L /state/.gitconfig ]]; then
            cp -n -- /state/.gitconfig /state/.config/git/config
          fi
        volumeMounts:
        - name: data
          mountPath: /state
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.command }}
        command:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.args }}
        args:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        env:
        {{- if and .Values.persistence.enabled (not (hasKey $environment "CLAUDE_CONFIG_DIR")) }}
        - name: CLAUDE_CONFIG_DIR
          value: /home/box/.claude
        {{- end }}
        {{- if and .Values.persistence.enabled (not (hasKey $environment "GEMINI_HISTORY_HOME")) }}
        - name: GEMINI_HISTORY_HOME
          value: /home/box/.hive-mind-gemini-history
        {{- end }}
        {{- if and .Values.secrets .Values.secrets.githubToken (ne .Values.secrets.githubToken "") }}
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.githubToken }}
              key: token
        {{- end }}
        {{- if and .Values.secrets .Values.secrets.claudeApiKey (ne .Values.secrets.claudeApiKey "") }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.claudeApiKey }}
              key: apiKey
        {{- end }}
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if .Values.service.enabled }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "test -f /home/box/.claude.json"
          initialDelaySeconds: 30
          periodSeconds: 10
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "test -f /home/box/.claude.json"
          initialDelaySeconds: 5
          periodSeconds: 5
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        {{- range $statePaths }}
        - name: data
          mountPath: /home/box/{{ . }}
          subPath: {{ . }}
        {{- end }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default (include "hive-mind.fullname" .) }}
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
