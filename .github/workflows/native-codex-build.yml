name: Native Codex release build

on:
  pull_request:
    paths:
      - 'scripts/build-native-codex.py'
      - 'src/native-codex/**'
      - 'experiments/issue-3785/native-codex/**'
      - 'experiments/issue-3785/test_native_codex_build.py'
      - 'experiments/issue-3785/probe_native_codex_preparation.py'
      - 'experiments/issue-3785/probe-codex-native-auth-root.mjs'
      - 'experiments/issue-3785/probe-codex-native-request-auth.mjs'
      - 'experiments/issue-3785/native-request-proxy.mjs'
      - '.github/workflows/native-codex-build.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codex-release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and exercise ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Test build input and executable admission
        run: python3 experiments/issue-3785/test_native_codex_build.py
      - name: Install the pinned compiler and native build prerequisites
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          {
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          } > "$RUNNER_TEMP/native-release-prerequisites.log" 2>&1 &
          wait "$!"
      - name: Prepare the immutable native source and all verified adapters
        run: |
          native_source="$RUNNER_TEMP/codex-release-source"
          git init "$native_source"
          git -C "$native_source" remote add origin https://github.com/openai/codex.git
          node scripts/github-retry.mjs git -C "$native_source" fetch --depth 1 origin 6aaac694803004a63c6f393d153c96d22521a6b9
          git -C "$native_source" checkout --detach FETCH_HEAD
          python3 scripts/build-native-codex.py prepare "$native_source" "$RUNNER_TEMP/native-release-source.json" > "$RUNNER_TEMP/native-release-prepare.log" 2>&1
      - name: Build the optimized native CLI and verify the packaged identity
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/build-native-codex.py build "$RUNNER_TEMP/codex-release-source" "$RUNNER_TEMP/native-release-source.json" "$NATIVE_PLATFORM" "$RUNNER_TEMP/native-codex-runtime" > "$RUNNER_TEMP/native-release-build.log" 2>&1
      - name: Exercise actual packaged authentication and model request authority
        env:
          CODEX_NATIVE_EXPERIMENT: ${{ runner.temp }}/native-codex-runtime/codex
        run: |
          node --max-old-space-size=256 experiments/issue-3785/probe-codex-native-auth-root.mjs "$CODEX_NATIVE_EXPERIMENT" > "$RUNNER_TEMP/native-release-auth.log" 2>&1
          node --max-old-space-size=256 experiments/issue-3785/probe-codex-native-request-auth.mjs "$CODEX_NATIVE_EXPERIMENT" > "$RUNNER_TEMP/native-release-request.log" 2>&1
          node --max-old-space-size=256 experiments/issue-3785/probe-codex-native-request-auth.mjs "$CODEX_NATIVE_EXPERIMENT" --provider-overrides > "$RUNNER_TEMP/native-release-overrides.log" 2>&1
          node --max-old-space-size=256 experiments/issue-3785/probe-codex-native-request-auth.mjs "$CODEX_NATIVE_EXPERIMENT" --provider-constructors > "$RUNNER_TEMP/native-release-constructors.log" 2>&1
      - name: Preserve native build and request diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-codex-build-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/native-release-*.log
            ${{ runner.temp }}/native-release-source.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the verified self-contained platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-codex-runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-codex-runtime/
          if-no-files-found: error
          retention-days: 14
