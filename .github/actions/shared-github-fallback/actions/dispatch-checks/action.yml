name: Dispatch pull request checks
description: Compatibility contract for link-foundation/.github issue 1
inputs:
  ref:
    description: Pull request head branch
    required: true
  workflows:
    description: Space or newline separated check workflow filenames
    required: true
  token:
    description: Resolved GitHub credential
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        CHECK_REF: ${{ inputs.ref }}
        CHECK_WORKFLOWS: ${{ inputs.workflows }}
      run: node "$ACTION_PATH/dispatch.mjs"
