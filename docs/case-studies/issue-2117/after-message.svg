<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Expected Telegram completion message after the issue 2117 fix</title>
  <desc id="desc">A Telegram-style message reports that the pull request merged while the runner also exited with code 1.</desc>
  <rect width="1200" height="620" fill="#dbe7ef"/>
  <rect x="110" y="55" width="980" height="510" rx="24" fill="#ffffff"/>
  <circle cx="165" cy="115" r="30" fill="#f2b84b"/>
  <text x="165" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">⚠</text>
  <text x="220" y="102" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17212b">Hive Mind</text>
  <text x="220" y="142" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17212b">⚠ Pull request merged, but the work session exited with code: 1</text>
  <text x="155" y="205" font-family="Arial, sans-serif" font-size="23" fill="#17212b">⏱ Duration: 23m 58s</text>
  <text x="155" y="248" font-family="Arial, sans-serif" font-size="23" fill="#17212b">📊 Session: 7b9dda93-d08e-4fb6-ae7d-0a80c5b3cf56</text>
  <text x="155" y="291" font-family="Arial, sans-serif" font-size="23" fill="#17212b">🔒 Isolation: docker</text>
  <text x="155" y="350" font-family="Arial, sans-serif" font-size="23" fill="#17212b">Issue: github.com/link-foundation/use-m/issues/68</text>
  <text x="155" y="393" font-family="Arial, sans-serif" font-size="23" fill="#17212b">Pull request: github.com/link-foundation/use-m/pull/69</text>
  <text x="155" y="465" font-family="Arial, sans-serif" font-size="23" fill="#238636">✅ The requested pull request was merged successfully.</text>
  <text x="155" y="508" font-family="Arial, sans-serif" font-size="23" fill="#a15c00">⚠ The runner also failed; its exit code is preserved for investigation.</text>
</svg>
