# Open a Formal AI draft for every new issue (issue #2233).
#
# Every issue opened here gets one attempt from
# `solve --tool agent --model formal-ai --attach-logs --verbose` within minutes,
# on a branch nobody depends on. A wrong attempt costs nothing; a right one
# saves the first commit. The failure policy is deliberate and is documented in
# docs/FORMAL-AI-DRAFTS.md: a failed draft stays open and red until a later run
# succeeds, it is never hand-corrected and merged, and a poor draft is closed
# with the defect filed against the meta algorithm rather than patched on the
# branch. That is why nothing below merges, closes or fixes anything.
#
# The trigger is `issues: opened`, not a curated label, because the point is
# volume of evidence per day rather than a human deciding which issues deserve
# an attempt. `scripts/formal-ai-draft.lib.mjs` holds every decision this
# workflow makes, and tests/formal-ai-draft-2233.test.mjs parses the command it
# builds through solve's own strict argument parser.
name: Formal AI Draft

on:
  issues:
    types: [opened]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to re-attempt a draft for'
        required: true
        type: string

# All credential layers can open a draft; default-token checks use dispatch.
permissions:
  contents: read

jobs:
  health:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install automation dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Report actual draft attempts over seven days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/formal-ai-draft-health.mjs
  draft:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    if: github.event_name != 'schedule'
    name: Formal AI draft
    runs-on: ubuntu-24.04
    # One attempt is a full working session. 90 minutes is the ceiling at which
    # a hung session is cheaper to kill and re-attempt than to wait out; solve's
    # own restart loop is disabled for this run, so nothing legitimately runs
    # longer.
    timeout-minutes: 90
    # Per-issue, and never cancelling: two attempts on the same issue must not
    # race for the same branch, and an attempt already writing to a branch must
    # not be killed halfway through by a manual replay.
    concurrency:
      group: formal-ai-draft-${{ github.repository }}-${{ github.event.issue.number || github.event.inputs.issue_number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install automation dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Resolve GitHub credentials
        id: gh
        uses: ./.github/actions/resolve-github-token # https://github.com/link-foundation/.github/issues/1
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          default-token: ${{ github.token }}

      # The issue title and body are never interpolated into a `run:` block;
      # the script reads the payload from GITHUB_EVENT_PATH itself.
      - name: Decide whether to attempt a draft
        id: decide
        env:
          FORMAL_AI_DRAFT_ISSUE: ${{ github.event.inputs.issue_number }}
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: node scripts/formal-ai-draft.mjs --decide

      - name: Free disk space for the hive-mind image
        if: steps.decide.outputs.should_run == 'true'
        run: node scripts/free-disk-space.mjs

      - name: Open the Formal AI draft
        id: attempt
        if: steps.decide.outputs.should_run == 'true'
        env:
          FORMAL_AI_DRAFT_ISSUE: ${{ github.event.inputs.issue_number }}
          FORMAL_AI_DRAFT_IMAGE: ${{ vars.FORMAL_AI_DRAFT_IMAGE || 'konard/hive-mind:latest' }}
          FORMAL_AI_INSTALL_GRANT: workspace
          FORMAL_AI_DRAFT_LOG_DIR: ${{ runner.temp }}/formal-ai-draft-logs
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: node scripts/formal-ai-draft.mjs

      - name: Dispatch checks on the draft head
        if: ${{ !cancelled() && steps.attempt.outputs.head_branch != '' }}
        uses: ./.github/actions/dispatch-checks # https://github.com/link-foundation/.github/issues/1
        with:
          ref: ${{ steps.attempt.outputs.head_branch }}
          token: ${{ steps.gh.outputs.token }}
          triggers-workflows: ${{ steps.gh.outputs.triggers-workflows }}

      # `--attach-logs` already puts the session log on the pull request. This
      # is the copy for the case where no pull request was opened at all, which
      # is exactly the failure mode worth reading. `!cancelled()` rather than
      # `always()`: see tests/ci-workflow-cancellation-2082.test.mjs.
      - name: Upload the session log
        if: ${{ !cancelled() && steps.decide.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: formal-ai-draft-session-${{ steps.decide.outputs.issue_number }}
          path: ${{ runner.temp }}/formal-ai-draft-logs
          if-no-files-found: warn
          retention-days: 30
