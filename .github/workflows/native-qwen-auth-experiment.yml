name: Native Qwen auth adapter experiment

on:
  pull_request:
    paths:
      - 'experiments/issue-3785/native-qwen/**'
      - 'experiments/issue-3785/native-oauth-transaction.mjs'
      - 'experiments/issue-3785/probe-qwen-native-reads.mjs'
      - 'experiments/issue-3785/probe-qwen-lock-ownership.mjs'
      - 'experiments/issue-3785/probe-qwen-native-writers.mjs'
      - 'experiments/issue-3785/probe-qwen-native-cli.mjs'
      - 'experiments/issue-3785/probe-qwen-native-history.py'
      - 'experiments/issue-3785/native_process_group.py'
      - 'src/shared-auth-refresh-lock.lib.mjs'
      - '.github/workflows/native-qwen-auth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-qwen-auth-experiment-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native-credential-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install the exact native package without lifecycle scripts or optional binaries
        run: |
          npm ci --prefix experiments/issue-3785/native-qwen/stock-cli --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/qwen-dependencies.log" 2>&1 &
          wait "$!"
          echo "QWEN_PROBE_MODULE=$GITHUB_WORKSPACE/experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code/chunks/chunk-KZQDCUQR.js" >> "$GITHUB_ENV"
      - name: Reproduce actual native stale replacement and logout reads
        run: node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs --expect-native-gaps > "$RUNNER_TEMP/qwen-reads-before.log" 2>&1
      - name: Require the strict regression to fail for stale native authority
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs > "$RUNNER_TEMP/qwen-reads-regression.log" 2>&1; then
            echo 'The native read regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: A forced native credential read must observe atomic same-timestamp replacement.' "$RUNNER_TEMP/qwen-reads-regression.log"
      - name: Preserve the separate native ownership defect and healthy control
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-lock-ownership.mjs --without-observer-manager > "$RUNNER_TEMP/qwen-ownership-control.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-lock-ownership.mjs > "$RUNNER_TEMP/qwen-ownership-before.log" 2>&1
      - name: Apply the exact pinned native read experiment
        run: |
          python3 experiments/issue-3785/native-qwen/apply_reads.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code --check
          python3 experiments/issue-3785/native-qwen/apply_reads.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code
      - name: Verify native reads, cache clearing, repair and unsafe storage refusal
        run: node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs > "$RUNNER_TEMP/qwen-reads-after.log" 2>&1
      - name: Reproduce native OAuth client swallowing storage refusal
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs --native-client --expect-undefined-token > "$RUNNER_TEMP/qwen-client-before.log" 2>&1
          if node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs --native-client > "$RUNNER_TEMP/qwen-client-regression.log" 2>&1; then
            echo 'The native client refusal regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: Native logout must invalidate cached credentials before a read or refresh exchange.' "$RUNNER_TEMP/qwen-client-regression.log"
      - name: Apply the exact pinned native coordination experiment
        run: |
          python3 experiments/issue-3785/native-qwen/apply_coordination.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code --check
          python3 experiments/issue-3785/native-qwen/apply_coordination.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code
      - name: Verify native ownership across private configurations
        run: node --max-old-space-size=128 experiments/issue-3785/probe-qwen-lock-ownership.mjs --expect-coordinated --private-configs > "$RUNNER_TEMP/qwen-ownership-after.log" 2>&1
      - name: Verify native manager and OAuth client refuse unsafe authority
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs > "$RUNNER_TEMP/qwen-coordinated-reads.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-reads.mjs --native-client > "$RUNNER_TEMP/qwen-client-after.log" 2>&1
      - name: Verify native refresh, login, logout and failure ordering
        run: node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-writers.mjs > "$RUNNER_TEMP/qwen-writers-after.log" 2>&1
      - name: Reproduce independent authority in actual native CLI requests
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs --expect-provider-bypass > "$RUNNER_TEMP/qwen-cli-before.log" 2>&1
          if node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs > "$RUNNER_TEMP/qwen-cli-regression.log" 2>&1; then
            echo 'The native CLI authority regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: Selected canonical Qwen authority must refuse independent provider credentials before model execution.' "$RUNNER_TEMP/qwen-cli-regression.log"
      - name: Apply pinned native provider admission
        run: |
          python3 experiments/issue-3785/native-qwen/apply_request_auth.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code --check
          python3 experiments/issue-3785/native-qwen/apply_request_auth.py experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code
      - name: Verify real CLI refusal, native provider handles and preserved behavior
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs > "$RUNNER_TEMP/qwen-cli-after.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs --factory-controls > "$RUNNER_TEMP/qwen-factory-after.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs --without-selector > "$RUNNER_TEMP/qwen-cli-legacy.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-qwen-native-cli.mjs --oauth-sunset > "$RUNNER_TEMP/qwen-cli-sunset.log" 2>&1
      - name: Verify actual completed history after private configuration disposal
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          native_package="$GITHUB_WORKSPACE/experiments/issue-3785/native-qwen/stock-cli/node_modules/@qwen-code/qwen-code"
          native_node="$(command -v node)"
          python3 experiments/issue-3785/probe-qwen-native-history.py "$native_package" --node "$native_node" --private-history --expect-history-gap --diagnostics "$RUNNER_TEMP/qwen-history-before-native.log" > "$RUNNER_TEMP/qwen-history-before.log" 2>&1
          if python3 experiments/issue-3785/probe-qwen-native-history.py "$native_package" --node "$native_node" --private-history --diagnostics "$RUNNER_TEMP/qwen-history-strict-native.log" > "$RUNNER_TEMP/qwen-history-strict.log" 2>&1; then
            echo 'The private-runtime history regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'A fresh native Qwen peer must resume persisted history.' "$RUNNER_TEMP/qwen-history-strict.log"
          python3 experiments/issue-3785/probe-qwen-native-history.py "$native_package" --node "$native_node" --diagnostics "$RUNNER_TEMP/qwen-history-after-native.log" > "$RUNNER_TEMP/qwen-history-after.log" 2>&1
      - name: Preserve native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-qwen-auth-experiment
          path: ${{ runner.temp }}/qwen-*.log
          if-no-files-found: ignore
          retention-days: 7
