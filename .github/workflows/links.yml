name: Broken Link Checker

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.html'
      - '.lycheeignore'
      - 'scripts/check-web-archive.mjs'
      - 'scripts/install-lychee.sh'
      - 'scripts/recheck-broken-links.mjs'
      - '.github/workflows/links.yml'
  pull_request:
    branches-ignore: ['e2e/**']
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.html'
      - '.lycheeignore'
      - 'scripts/check-web-archive.mjs'
      - 'scripts/install-lychee.sh'
      - 'scripts/recheck-broken-links.mjs'
      - '.github/workflows/links.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Checks-only dispatch
        type: choice
        default: checks
        options: [checks]

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  link-checker:
    name: Check Links
    runs-on: ubuntu-24.04
    # Typical run: <1min with lychee cache. 10min prevents slow
    # external hosts or Wayback Machine probes from hanging the workflow.
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-link-checker
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install lychee
        # Not lycheeverse/lychee-action: it downloads lychee with one
        # `curl -sfLO` and no retry, so a single transient release-CDN error
        # failed this job on main with no broken link (issue #4025, run
        # 42570340566, curl exit 22). The installer retries and verifies the
        # published SHA-256.
        env:
          LYCHEE_VERSION: v0.24.2
        run: scripts/install-lychee.sh

      - name: Check links with lychee
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Check all Markdown and HTML files.
        #
        # Exclusions (kept in sync with EXCLUDED_PREFIXES in
        # tests/doc-links-2198.test.mjs, which enforces the same list):
        #   docs/case-studies      - research notes copied from other repos;
        #                            they reference files and issues that
        #                            only exist there.
        #   dev/log                - per-issue evidence archives, same story.
        #   experiments/.../corpus - fixture text captured verbatim from
        #                            third-party output.
        #   tests/fixtures         - the captured lychee report there holds
        #                            deliberately broken links used as
        #                            parser test input.
        #
        # Broken links don't fail this step: the Web Archive is checked first
        # so the report can suggest replacements, and "Fail if broken links
        # were found" fails the job. lychee's own failures (bad arguments,
        # crash, no report, no links found) fail here, so they can never
        # pass as "no broken links".
        run: |
          mkdir -p lychee
          set +e
          lychee --mode task --format markdown --output lychee/out.md \
            --verbose \
            --no-progress \
            --cache \
            --max-cache-age 1d \
            --max-retries 3 \
            --timeout 30 \
            --exclude-path docs/case-studies \
            --exclude-path dev/log \
            --exclude-path experiments/issue-2102/corpus \
            --exclude-path tests/fixtures \
            './**/*.md' \
            './**/*.html'
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if ! grep -q '^# Summary' lychee/out.md 2>/dev/null; then
            echo "::error title=lychee failed::lychee exited with code $exit_code without writing a report; see the output above."
            exit 1
          fi
          cat lychee/out.md
          cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq 'Total\s+\|\s+0\s*\|' lychee/out.md; then
            echo "::error title=No links checked::lychee found no links; the input globs or exclusions are wrong."
            exit 1
          fi
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then
            echo "::error title=lychee failed::lychee exited with code $exit_code (2 means broken links); see the output above."
            exit 1
          fi

      - name: Re-check links that failed transiently
        # A 429, a 5xx or a connection failure is "not now", not "broken":
        # github.com throttles blob-page bursts from runner IPs with 503
        # (issue #2423). Ask those URLs again with backoff; 4xx stays final.
        if: steps.lychee.outputs.exit_code != 0
        id: recheck
        run: node scripts/recheck-broken-links.mjs
        env:
          LYCHEE_OUTPUT: lychee/out.md
          RECOVERED_OUTPUT: lychee/recovered.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check broken links against Web Archive
        # `!= 'true'`, never `== 'false'`: a skipped re-check leaves the
        # output empty, and only the != form fails safe.
        if: >-
          steps.lychee.outputs.exit_code != 0 &&
          steps.recheck.outputs.all_recovered != 'true'
        id: webarchive
        run: node scripts/check-web-archive.mjs
        env:
          LYCHEE_OUTPUT: lychee/out.md
          RECOVERED_URLS: lychee/recovered.txt

      - name: Fail if broken links were found
        if: >-
          !cancelled() &&
          steps.lychee.outputs.exit_code != 0 &&
          steps.recheck.outputs.all_recovered != 'true'
        run: |
          echo "::error::Broken live links were detected."
          echo ""
          echo "What happened:"
          echo "  lychee found one or more broken links in the *.md and *.html files of this repository."
          echo "  An archive is a suggested replacement; it does not make the live link valid."
          echo ""
          echo "How to fix:"
          echo "  1. Review the 'Check links with lychee' step above for a full list of broken links."
          echo "  2. For links marked with a '::notice::' annotation above, a Web Archive replacement exists."
          echo "     Replace those broken links with the suggested archive.org URL."
          echo "  3. For links with no archive version, either:"
          echo "     a. Find an updated URL that points to the same or equivalent content."
          echo "     b. Remove the link if the content is no longer relevant."
          echo "     c. Add the URL to .lycheeignore if it is a known false positive."
          echo ""
          echo "Report location: lychee/out.md (available as a workflow artifact if configured)."
          exit 1
