name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: ['e2e/**']
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Checks-only dispatch
        type: choice
        default: checks
        options: [checks]

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Diff-informed analysis reports only results on lines a pull request
    # changes; the gate below needs every result (issue #4025).
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      # The analyze step uploads its results and passes even when it finds
      # problems, so 44 alerts piled up on main behind a green check (issue
      # #4025). Fail on any result, extractor warning or failed invocation.
      - name: Require clean CodeQL results
        if: ${{ !cancelled() }}
        run: node scripts/check-codeql-results.mjs codeql-results

      - name: Upload CodeQL reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Issue #2198: neither of the jobs above audits the dependency tree we ship.
  # CodeQL analyses our source; dependency-review only runs on pull requests and
  # only inspects the dependencies a PR *changes*, so an advisory published for a
  # long-pinned package is invisible to it forever. Ported from the pipeline
  # template's security.yml, without its workspace matrix -- package-lock.json is
  # the only lockfile in this repository.
  npm-audit:
    name: Audit npm lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # --package-lock-only audits the lockfile as committed, without installing:
      # the job reports on what a consumer would get, and cannot be turned green
      # by a resolution that only happens on this runner.
      - name: Audit current lock
        run: npm audit --package-lock-only --audit-level=high
