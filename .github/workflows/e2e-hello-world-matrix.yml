# The Hello World end-to-end matrix (issue #2319).
#
# One run per row: `solve <issue> --tool <tool> --model <model>` against a
# fresh Hello World task (or a given one), then assert on the pull request it
# produced — ready for review, the diff is only the program, the workflow and a
# test script, the program prints exactly `Hello, World!`, the workflow is
# green, the body was regenerated, and there is no `🛑 Automation stopped`
# comment. Formal AI runs through every tool; the LLM row is the control, so a
# row that fails only for Formal AI is a model-specific path by construction.
#
# Manual only: every row creates an orphan fixture in this repository and
# spends a full working session. Each row cleans its resources afterwards.
# The assertions live in scripts/e2e-hello-world.lib.mjs and are unit-tested by
# tests/e2e-hello-world-matrix-2319.test.mjs.
name: E2E Hello World Matrix

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: 'Existing Hello World issue to reuse for every row (empty: create a fresh one per row)'
        required: false
        type: string
        default: ''

# Optional credentials resolve once; branch isolation also works token-free.
permissions:
  contents: read

jobs:
  hello-world:
    name: ${{ matrix.tool }} / ${{ matrix.model }}
    runs-on: ubuntu-24.04
    # A session plus up to 30 minutes waiting for the task repository's checks.
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      # Keep in sync with E2E_MATRIX in scripts/e2e-hello-world.lib.mjs
      # (asserted by tests/e2e-hello-world-matrix-2319.test.mjs).
      matrix:
        include:
          - tool: claude
            model: formal-ai
          - tool: agent
            model: formal-ai
          - tool: codex
            model: formal-ai
          - tool: agent
            model: nemotron-3-super-free

    steps:
      - name: Resolve GitHub credentials
        id: gh
        uses: link-foundation/.github/actions/resolve-github-token@main
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          default-token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies for GitHub API retries
        run: node scripts/npm-install-with-retry.mjs ci

      - name: Free disk space for the hive-mind image
        run: node scripts/free-disk-space.mjs

      - name: Install act for default-token generated workflows
        if: steps.gh.outputs.layer == 'default'
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/act"
          gh release download v0.2.89 --repo nektos/act --pattern act_Linux_x86_64.tar.gz --dir "$RUNNER_TEMP/act"
          tar -xzf "$RUNNER_TEMP/act/act_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/act"
          echo "$RUNNER_TEMP/act" >> "$GITHUB_PATH"

      # Inputs reach the script through the environment, never through `run:`
      # interpolation (zizmor template-injection).
      - name: Run and verify
        env:
          E2E_TOOL: ${{ matrix.tool }}
          E2E_MODEL: ${{ matrix.model }}
          E2E_ISSUE_URL: ${{ inputs.issue_url }}
          E2E_IMAGE: ${{ vars.E2E_IMAGE || 'konard/hive-mind:latest' }}
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-hello-world-logs
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          AUTOMATION_CAN_CREATE_REPOSITORIES: ${{ steps.gh.outputs.can-create-repositories }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -- --tool "$E2E_TOOL" --model "$E2E_MODEL"
          if [ -n "$E2E_ISSUE_URL" ]; then set -- "$@" --issue "$E2E_ISSUE_URL"; fi
          node scripts/e2e-hello-world.mjs "$@"

      # `!cancelled()` rather than `always()`: see
      # tests/ci-workflow-cancellation-2082.test.mjs.
      - name: Upload the session log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-hello-world-${{ matrix.tool }}-${{ matrix.model }}
          path: ${{ runner.temp }}/e2e-hello-world-logs
          if-no-files-found: warn
          retention-days: 30
