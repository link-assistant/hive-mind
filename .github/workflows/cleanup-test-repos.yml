name: Cleanup Test Repositories

on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List stale resources without deleting them'
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: github-test-cleanup-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve GitHub credentials
        id: gh
        uses: ./.github/actions/resolve-github-token
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          default-token: ${{ github.token }}
          permissions: '{"contents":"write","issues":"write","pull_requests":"write"}'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies for GitHub API retries
        run: node scripts/npm-install-with-retry.mjs ci
      - name: Clean stale GitHub test resources
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          CLEANUP_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/cleanup-github-tests.mjs
