name: Native Gemini auth adapter experiment

on:
  pull_request:
    paths:
      - 'experiments/issue-3785/native-gemini/**'
      - 'experiments/issue-3785/native-qwen/read_credentials.mjs'
      - 'experiments/issue-3785/native-oauth-transaction.mjs'
      - 'src/shared-auth-refresh-lock.lib.mjs'
      - 'experiments/issue-3785/probe-gemini-native-writers.mjs'
      - 'experiments/issue-3785/probe-gemini-native-reads.mjs'
      - 'experiments/issue-3785/probe-gemini-native-request-auth.mjs'
      - 'experiments/issue-3785/probe-gemini-native-cli.py'
      - 'experiments/issue-3785/probe-gemini-native-history-storage.py'
      - 'experiments/issue-3785/native_process_group.py'
      - 'experiments/issue-3785/gemini_restorable_tui.py'
      - 'experiments/issue-3785/gemini_restorable_acp.py'
      - 'experiments/issue-3785/gemini_restorable_headless.py'
      - 'experiments/issue-3785/gemini_resume_refusal.py'
      - 'experiments/issue-3785/gemini_resume_interruption.py'
      - 'experiments/issue-3785/gemini_subagent_history.py'
      - 'experiments/issue-3785/gemini_live_audit.py'
      - 'experiments/issue-3785/gemini_live_audit_interactive.py'
      - 'experiments/issue-3785/gemini_live_summary.py'
      - '.github/workflows/native-gemini-auth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gemini-auth-experiment-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native-credential-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install the exact native package without lifecycle scripts or optional binaries
        run: |
          npm ci --prefix experiments/issue-3785/native-gemini/stock-cli --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/gemini-dependencies.log" 2>&1 &
          wait "$!"
          echo "GEMINI_PROBE_MODULE=$GITHUB_WORKSPACE/experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli/bundle/chunk-DKZARV6U.js" >> "$GITHUB_ENV"
      - name: Reproduce actual native factory and retained-client stale headers
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --expect-native-gaps > "$RUNNER_TEMP/gemini-reads-before.log" 2>&1
      - name: Require the strict regression to fail for stale native authority
        run: |
          if node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs > "$RUNNER_TEMP/gemini-reads-regression.log" 2>&1; then
            echo 'The native Gemini read regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: replacement: native factory' "$RUNNER_TEMP/gemini-reads-regression.log"
          grep -F "selected: 'G0'" "$RUNNER_TEMP/gemini-reads-regression.log"
          grep -F "selected: 'G1'" "$RUNNER_TEMP/gemini-reads-regression.log"
      - name: Reproduce native loss of the provider's rotated refresh token
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --legacy-configs --scenario=direct-refresh > "$RUNNER_TEMP/gemini-rotation-before.log" 2>&1; then
            echo 'The native rotating-token regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F "'synthetic-refresh-G0'" "$RUNNER_TEMP/gemini-rotation-before.log"
          grep -F "'synthetic-refresh-G1'" "$RUNNER_TEMP/gemini-rotation-before.log"
          grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-rotation-before.log"
      - name: Apply exact pinned native read admission
        run: |
          python3 experiments/issue-3785/native-gemini/apply_reads.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_reads.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Verify actual native headers observe replacement and refuse unsafe storage
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs > "$RUNNER_TEMP/gemini-reads-after.log" 2>&1
      - name: Verify independent private configuration, disposal and read-stage writer refusal
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --private-configs --refusal-controls > "$RUNNER_TEMP/gemini-private-reads-after.log" 2>&1
      - name: Require the read-stage refresh regression to fail
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=two-refreshes > "$RUNNER_TEMP/gemini-writers-before.log" 2>&1; then
            echo 'The read stage unexpectedly completed coordinated native refresh.'
            exit 1
          fi
          grep -F 'expired native credentials must exchange' "$RUNNER_TEMP/gemini-writers-before.log"
          grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-writers-before.log"
      - name: Require native login and revocation regressions to fail before coordination
        run: |
          for scenario in auth-code initial-login revoke; do
            if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario="$scenario" > "$RUNNER_TEMP/gemini-$scenario-before.log" 2>&1; then
              echo "The read-stage $scenario regression unexpectedly passed before repair."
              exit 1
            fi
            grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-$scenario-before.log"
            grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-$scenario-before.log"
          done
      - name: Require account cache and callback regressions before coordination
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=account-cache > "$RUNNER_TEMP/gemini-accounts-before.log" 2>&1; then
            echo 'The read-stage account cache regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'ENOENT' "$RUNNER_TEMP/gemini-accounts-before.log"
          grep -F 'google_accounts.json' "$RUNNER_TEMP/gemini-accounts-before.log"
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=account-callback > "$RUNNER_TEMP/gemini-callback-before.log" 2>&1; then
            echo 'The read-stage callback regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-callback-before.log"
          grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-callback-before.log"
      - name: Apply exact pinned native writer coordination
        run: |
          python3 experiments/issue-3785/native-gemini/apply_coordination.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_coordination.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Reproduce actual alternate constructors and retained request authority
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --expect-native-gaps > "$RUNNER_TEMP/gemini-requests-before.log" 2>&1
      - name: Require the selected constructor regression to fail before admission
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --scenario=constructor-api-key > "$RUNNER_TEMP/gemini-constructor-regression.log" 2>&1; then
            echo 'The selected native API-key constructor unexpectedly refused before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: constructor-api-key: actual native authority admission' "$RUNNER_TEMP/gemini-constructor-regression.log"
          grep -F "selected: 'accepted'" "$RUNNER_TEMP/gemini-constructor-regression.log"
          grep -F 'requests: 1' "$RUNNER_TEMP/gemini-constructor-regression.log"
      - name: Apply exact pinned native constructor and request admission
        run: |
          python3 experiments/issue-3785/native-gemini/apply_request_auth.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_request_auth.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Refuse competing native request authority and observe canonical replacement
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs > "$RUNNER_TEMP/gemini-requests-after.log" 2>&1
      - name: Preserve unselected native constructors and request dispatch
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --without-selector > "$RUNNER_TEMP/gemini-requests-legacy.log" 2>&1
      - name: Verify native refresh, login, accounts, callbacks, revocation and crash recovery
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs > "$RUNNER_TEMP/gemini-writers-after.log" 2>&1
      - name: Complete actual CLI OAuth inference through a TLS-verifying local provider
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-cli-healthy.log" > "$RUNNER_TEMP/gemini-cli-healthy-control.log" 2>&1
      - name: Reproduce actual native history loss after private configuration disposal
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --expect-history-gap --diagnostics "$RUNNER_TEMP/gemini-cli-history-before.log" > "$RUNNER_TEMP/gemini-cli-history-before-control.log" 2>&1
      - name: Require the strict full CLI history regression to fail at discovery
        run: |
          if python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --diagnostics "$RUNNER_TEMP/gemini-cli-history-regression.log" > "$RUNNER_TEMP/gemini-cli-history-regression-control.log" 2>&1; then
            echo 'The native CLI history regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError: A fresh native CLI must discover canonical conversation history.' "$RUNNER_TEMP/gemini-cli-history-regression-control.log"
      - name: Preserve coordinated native canonical reads and private-scope isolation
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --private-configs > "$RUNNER_TEMP/gemini-coordinated-reads.log" 2>&1
      - name: Preserve no-selector native behavior
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --without-selector --expect-native-gaps > "$RUNNER_TEMP/gemini-legacy-reads.log" 2>&1
      - name: Apply exact pinned native conversation storage
        run: |
          python3 experiments/issue-3785/native-gemini/apply_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Reproduce full tool-output loss after successful native shell execution
        run: |
          if python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-tool-output --diagnostics "$RUNNER_TEMP/gemini-artifact-before.log" > "$RUNNER_TEMP/gemini-artifact-before-control.log" 2>&1; then
            echo 'The native tool-output lifetime regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError: Native tool-output history must survive private-home disposal.' "$RUNNER_TEMP/gemini-artifact-before-control.log"
      - name: Apply exact pinned native artifact storage
        run: |
          python3 experiments/issue-3785/native-gemini/apply_artifacts.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_artifacts.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Read complete native tool output after private home disposal and resume
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-tool-output --diagnostics "$RUNNER_TEMP/gemini-artifact-after.log" > "$RUNNER_TEMP/gemini-artifact-after-control.log" 2>&1
      - name: Verify the native truncation and both masking writers
        run: python3 experiments/issue-3785/native-gemini/probe_artifacts.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-artifact-writers.log" > "$RUNNER_TEMP/gemini-artifact-writers-controls.log" 2>&1
      - name: Refuse unsafe native tool artifacts without another model request
        run: |
          for state in symlink hardlink unsafe-mode invalid-utf8 content-change oversized missing parent-replacement; do
            python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-tool-output --history-tool-output-attack "$state" --diagnostics "$RUNNER_TEMP/gemini-artifact-$state.log" > "$RUNNER_TEMP/gemini-artifact-$state-control.log" 2>&1
          done
      - name: Reproduce native degraded blob loss after successful image read
        run: |
          if python3 experiments/issue-3785/native-gemini/probe_blobs.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --scenario healthy --diagnostics "$RUNNER_TEMP/gemini-blob-before.log" > "$RUNNER_TEMP/gemini-blob-before-control.log" 2>&1; then
            echo 'The native degraded blob lifetime regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: Native degraded blob history must survive private-home disposal.' "$RUNNER_TEMP/gemini-blob-before-healthy.log"
          if python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-blob --diagnostics "$RUNNER_TEMP/gemini-blob-cli-before.log" > "$RUNNER_TEMP/gemini-blob-cli-before-control.log" 2>&1; then
            echo 'The complete native degraded blob lifetime regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError: Native degraded blob history must survive private-home disposal.' "$RUNNER_TEMP/gemini-blob-cli-before-control.log"
      - name: Apply exact pinned native multimodal blob storage
        run: |
          python3 experiments/issue-3785/native-gemini/apply_blobs.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_blobs.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Preserve native degraded images and refuse unsafe blob paths
        run: python3 experiments/issue-3785/native-gemini/probe_blobs.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-blob-after.log" > "$RUNNER_TEMP/gemini-blob-after-control.log" 2>&1
      - name: Resume complete native CLI and read the retained degraded PNG
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-blob --diagnostics "$RUNNER_TEMP/gemini-blob-cli-after.log" > "$RUNNER_TEMP/gemini-blob-cli-after-control.log" 2>&1
      - name: Refuse unsafe native degraded blobs before further inference
        run: |
          for attack in symlink hardlink unsafe-mode content-change oversized missing parent-replacement; do
            python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-blob --history-blob-attack "$attack" --diagnostics "$RUNNER_TEMP/gemini-blob-cli-$attack.log" > "$RUNNER_TEMP/gemini-blob-cli-$attack-control.log" 2>&1
          done
      - name: Reproduce native prompt and named-checkpoint lifetime and stale reads
        run: |
          for state in prompt-healthy checkpoint-healthy prompt-peer; do
            if python3 experiments/issue-3785/native-gemini/probe_logger.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --scenario "$state" --diagnostics "$RUNNER_TEMP/gemini-logger-before-$state.log" > "$RUNNER_TEMP/gemini-logger-before-$state-control.log" 2>&1; then
              echo 'The native Logger history regression unexpectedly passed.'
              exit 1
            fi
            case "$state" in
              prompt-healthy) phase=peer-prompt; expected='Native prompt history must survive private-home disposal.' ;;
              checkpoint-healthy) phase=peer-checkpoint; expected='Native named checkpoints must survive private-home disposal.' ;;
              prompt-peer) phase=initial; expected='Native prompt reads must observe the latest peer generation.' ;;
            esac
            grep -F "AssertionError [ERR_ASSERTION]: $expected" "$RUNNER_TEMP/gemini-logger-before-$state-$state-$phase.log"
          done
      - name: Apply exact pinned native Logger storage
        run: |
          python3 experiments/issue-3785/native-gemini/apply_logger.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_logger.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Preserve native prompts and checkpoint audit with independent writers
        run: python3 experiments/issue-3785/native-gemini/probe_logger.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-logger-after.log" > "$RUNNER_TEMP/gemini-logger-after-control.log" 2>&1
      - name: Reproduce interrupted first publication using the exact preceding helper
        run: |
          for family in registry prompt checkpoint artifact blob; do
            if python3 experiments/issue-3785/native-gemini/probe_publication.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --before-control --scenario "$family" --point after-link --diagnostics "$RUNNER_TEMP/gemini-publication-before-$family.log" > "$RUNNER_TEMP/gemini-publication-before-$family-control.log" 2>&1; then
              echo 'The preceding first-publication control unexpectedly passed.'
              exit 1
            fi
            grep -F 'Error: Gemini canonical conversation history is unavailable or unsafe.' "$RUNNER_TEMP/gemini-publication-before-$family-$family-after-link-peer.log"
          done
      - name: Recover native first publication after forced owner death
        run: |
          python3 experiments/issue-3785/native-gemini/probe_publication.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-publication-after.log" > "$RUNNER_TEMP/gemini-publication-after-control.log" 2>&1
          python3 experiments/issue-3785/native-gemini/probe_publication.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --live-journal-replacement --diagnostics "$RUNNER_TEMP/gemini-publication-live-journal.log" > "$RUNNER_TEMP/gemini-publication-live-journal-control.log" 2>&1
      - name: Refuse unsafe native publication evidence without changing protected data
        run: |
          for attack in journal-symlink journal-hardlink journal-mode journal-malformed journal-schema journal-invalid-utf8 journal-oversized journal-traversal journal-inode journal-digest stage-symlink stage-hardlink stage-mode stage-content stage-missing target-symlink target-hardlink target-mode target-content target-collision; do
            python3 experiments/issue-3785/native-gemini/probe_publication.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --attack "$attack" --diagnostics "$RUNNER_TEMP/gemini-publication-$attack.log" > "$RUNNER_TEMP/gemini-publication-$attack-control.log" 2>&1
          done
      - name: Reproduce native shell command loss, cached navigation and swallowed writes
        run: |
          for state in lifetime peer write-failure; do
            if python3 experiments/issue-3785/native-gemini/probe_shell_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --scenario "$state" --diagnostics "$RUNNER_TEMP/gemini-shell-before-$state.log" > "$RUNNER_TEMP/gemini-shell-before-$state-control.log" 2>&1; then
              echo 'The native shell history regression unexpectedly passed.'
              exit 1
            fi
            case "$state" in
              lifetime) phase=peer; expected='Native interactive shell history must survive private-home disposal.' ;;
              peer) phase=owner; expected='Native shell navigation must observe the latest peer command.' ;;
              write-failure) phase=owner; expected='Native shell submit must refuse a failed history write synchronously.' ;;
            esac
            grep -F "$expected" "$RUNNER_TEMP/gemini-shell-before-$state-$state-$phase.log"
          done
      - name: Reproduce command recall loss using the complete native terminal
        run: |
          if python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --shell-history --diagnostics "$RUNNER_TEMP/gemini-shell-tui-before.log" > "$RUNNER_TEMP/gemini-shell-tui-before-control.log" 2>&1; then
            echo 'The complete terminal history regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError: Fresh native TUI shell navigation must recover the prior command after private-home disposal.' "$RUNNER_TEMP/gemini-shell-tui-before-control.log"
      - name: Apply exact pinned native interactive shell history
        run: |
          python3 experiments/issue-3785/native-gemini/apply_shell_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_shell_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Retain command audit and observe independent native shell writers
        run: python3 experiments/issue-3785/native-gemini/probe_shell_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-shell-after.log" > "$RUNNER_TEMP/gemini-shell-after-control.log" 2>&1
      - name: Recall and execute the saved command in a fresh complete native terminal
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --shell-history --diagnostics "$RUNNER_TEMP/gemini-shell-tui-after.log" > "$RUNNER_TEMP/gemini-shell-tui-after-control.log" 2>&1
      - name: Refuse unsafe command history before native terminal inference or execution
        run: |
          for state in symlink hardlink unsafe-mode malformed invalid-utf8 oversized command-schema; do
            python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --shell-history --shell-history-attack "$state" --diagnostics "$RUNNER_TEMP/gemini-shell-tui-$state.log" > "$RUNNER_TEMP/gemini-shell-tui-$state-control.log" 2>&1
          done
      - name: Preserve native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-gemini-auth-experiment
          path: |
            ${{ runner.temp }}/gemini-*.log
            ${{ runner.temp }}/gemini-*.network.json
            ${{ runner.temp }}/gemini-*.control.json
          if-no-files-found: ignore
          retention-days: 7

  native-acp-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Rebuild the exact preceding terminal restore package
        run: |
          npm ci --prefix experiments/issue-3785/native-gemini/stock-cli --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/gemini-acp-dependencies.log" 2>&1 &
          wait "$!"
          package=experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
          echo "GEMINI_PROBE_MODULE=$GITHUB_WORKSPACE/$package/bundle/chunk-DKZARV6U.js" >> "$GITHUB_ENV"
          for stage in reads coordination request_auth; do
            python3 "experiments/issue-3785/native-gemini/apply_$stage.py" "$package" --check
            python3 "experiments/issue-3785/native-gemini/apply_$stage.py" "$package"
          done
          cp -a "$package" "$RUNNER_TEMP/gemini-acp-constructor-cli"
          for stage in history artifacts blobs logger shell_history tracker tracker_admission tracker_coordination git_history git_configuration git_objects git_services restorable_history restorable_admission; do
            python3 "experiments/issue-3785/native-gemini/apply_$stage.py" "$package" --check
            python3 "experiments/issue-3785/native-gemini/apply_$stage.py" "$package"
          done
