name: Dependabot Health
# Dependabot jobs pass while an open group pull request blocks every newer
# update (issue #4055, dependabot/dependabot-core#16791). This turns that
# state red on a schedule instead of leaving it to be noticed.
on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  stuck-pull-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: dependabot-health-${{ github.repository }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install automation dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Report Dependabot pull requests that block newer updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dependabot-health.mjs
