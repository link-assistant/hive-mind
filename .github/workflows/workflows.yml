name: Workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '**.sh'
      - '.husky/**'
  pull_request:
    branches-ignore: ['e2e/**']
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '**.sh'
      - '.husky/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Checks-only dispatch
        type: choice
        default: checks
        options: [checks]

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A native actionlint binary without shellcheck on
      # PATH silently skips the shell checks and exits 0 - worth knowing when
      # reproducing a failure locally:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # actionlint only checks the shell inside `run:` blocks. The scripts those
  # blocks call (and the git hooks) went unchecked; four warnings and errors
  # had accumulated there (issue #4025). experiments/, docs/case-studies/ and
  # dev/ hold archived research scripts that are not run by CI or users.
  # Notes and style hints (-S warning) are left to the author.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-shellcheck
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check standalone shell scripts and hooks
        run: |
          git ls-files -z '*.sh' '.husky/*' ':!:experiments/**' ':!:docs/case-studies/**' ':!:dev/**' \
            | xargs -0 pipx run --spec shellcheck-py==0.11.0.1 shellcheck -S warning

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Annotations instead of SARIF: code scanning is not enabled on every
      # fork of this repository, and the job should fail loudly either way.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: medium
