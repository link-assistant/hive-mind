name: Native Gemini auth adapter experiment

on:
  pull_request:
    paths:
      - 'experiments/issue-3785/native-gemini/**'
      - 'experiments/issue-3785/native-qwen/read_credentials.mjs'
      - 'experiments/issue-3785/native-oauth-transaction.mjs'
      - 'src/shared-auth-refresh-lock.lib.mjs'
      - 'experiments/issue-3785/probe-gemini-native-writers.mjs'
      - 'experiments/issue-3785/probe-gemini-native-reads.mjs'
      - 'experiments/issue-3785/probe-gemini-native-request-auth.mjs'
      - 'experiments/issue-3785/probe-gemini-native-cli.py'
      - 'experiments/issue-3785/probe-gemini-native-history-storage.py'
      - 'experiments/issue-3785/native_process_group.py'
      - '.github/workflows/native-gemini-auth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gemini-auth-experiment-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native-credential-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install the exact native package without lifecycle scripts or optional binaries
        run: |
          npm ci --prefix experiments/issue-3785/native-gemini/stock-cli --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/gemini-dependencies.log" 2>&1 &
          wait "$!"
          echo "GEMINI_PROBE_MODULE=$GITHUB_WORKSPACE/experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli/bundle/chunk-DKZARV6U.js" >> "$GITHUB_ENV"
      - name: Reproduce actual native factory and retained-client stale headers
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --expect-native-gaps > "$RUNNER_TEMP/gemini-reads-before.log" 2>&1
      - name: Require the strict regression to fail for stale native authority
        run: |
          if node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs > "$RUNNER_TEMP/gemini-reads-regression.log" 2>&1; then
            echo 'The native Gemini read regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: replacement: native factory' "$RUNNER_TEMP/gemini-reads-regression.log"
          grep -F "selected: 'G0'" "$RUNNER_TEMP/gemini-reads-regression.log"
          grep -F "selected: 'G1'" "$RUNNER_TEMP/gemini-reads-regression.log"
      - name: Reproduce native loss of the provider's rotated refresh token
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --legacy-configs --scenario=direct-refresh > "$RUNNER_TEMP/gemini-rotation-before.log" 2>&1; then
            echo 'The native rotating-token regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F "'synthetic-refresh-G0'" "$RUNNER_TEMP/gemini-rotation-before.log"
          grep -F "'synthetic-refresh-G1'" "$RUNNER_TEMP/gemini-rotation-before.log"
          grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-rotation-before.log"
      - name: Apply exact pinned native read admission
        run: |
          python3 experiments/issue-3785/native-gemini/apply_reads.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_reads.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Verify actual native headers observe replacement and refuse unsafe storage
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs > "$RUNNER_TEMP/gemini-reads-after.log" 2>&1
      - name: Verify independent private configuration, disposal and read-stage writer refusal
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --private-configs --refusal-controls > "$RUNNER_TEMP/gemini-private-reads-after.log" 2>&1
      - name: Require the read-stage refresh regression to fail
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=two-refreshes > "$RUNNER_TEMP/gemini-writers-before.log" 2>&1; then
            echo 'The read stage unexpectedly completed coordinated native refresh.'
            exit 1
          fi
          grep -F 'expired native credentials must exchange' "$RUNNER_TEMP/gemini-writers-before.log"
          grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-writers-before.log"
      - name: Require native login and revocation regressions to fail before coordination
        run: |
          for scenario in auth-code initial-login revoke; do
            if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario="$scenario" > "$RUNNER_TEMP/gemini-$scenario-before.log" 2>&1; then
              echo "The read-stage $scenario regression unexpectedly passed before repair."
              exit 1
            fi
            grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-$scenario-before.log"
            grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-$scenario-before.log"
          done
      - name: Require account cache and callback regressions before coordination
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=account-cache > "$RUNNER_TEMP/gemini-accounts-before.log" 2>&1; then
            echo 'The read-stage account cache regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'ENOENT' "$RUNNER_TEMP/gemini-accounts-before.log"
          grep -F 'google_accounts.json' "$RUNNER_TEMP/gemini-accounts-before.log"
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs --scenario=account-callback > "$RUNNER_TEMP/gemini-callback-before.log" 2>&1; then
            echo 'The read-stage callback regression unexpectedly passed.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]' "$RUNNER_TEMP/gemini-callback-before.log"
          grep -F "selected: 'rejected'" "$RUNNER_TEMP/gemini-callback-before.log"
      - name: Apply exact pinned native writer coordination
        run: |
          python3 experiments/issue-3785/native-gemini/apply_coordination.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_coordination.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Reproduce actual alternate constructors and retained request authority
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --expect-native-gaps > "$RUNNER_TEMP/gemini-requests-before.log" 2>&1
      - name: Require the selected constructor regression to fail before admission
        run: |
          if node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --scenario=constructor-api-key > "$RUNNER_TEMP/gemini-constructor-regression.log" 2>&1; then
            echo 'The selected native API-key constructor unexpectedly refused before repair.'
            exit 1
          fi
          grep -F 'AssertionError [ERR_ASSERTION]: constructor-api-key: actual native authority admission' "$RUNNER_TEMP/gemini-constructor-regression.log"
          grep -F "selected: 'accepted'" "$RUNNER_TEMP/gemini-constructor-regression.log"
          grep -F 'requests: 1' "$RUNNER_TEMP/gemini-constructor-regression.log"
      - name: Apply exact pinned native constructor and request admission
        run: |
          python3 experiments/issue-3785/native-gemini/apply_request_auth.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_request_auth.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Refuse competing native request authority and observe canonical replacement
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs > "$RUNNER_TEMP/gemini-requests-after.log" 2>&1
      - name: Preserve unselected native constructors and request dispatch
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs --without-selector > "$RUNNER_TEMP/gemini-requests-legacy.log" 2>&1
      - name: Verify native refresh, login, accounts, callbacks, revocation and crash recovery
        run: node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs > "$RUNNER_TEMP/gemini-writers-after.log" 2>&1
      - name: Complete actual CLI OAuth inference through a TLS-verifying local provider
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-cli-healthy.log" > "$RUNNER_TEMP/gemini-cli-healthy-control.log" 2>&1
      - name: Reproduce actual native history loss after private configuration disposal
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --expect-history-gap --diagnostics "$RUNNER_TEMP/gemini-cli-history-before.log" > "$RUNNER_TEMP/gemini-cli-history-before-control.log" 2>&1
      - name: Require the strict full CLI history regression to fail at discovery
        run: |
          if python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --diagnostics "$RUNNER_TEMP/gemini-cli-history-regression.log" > "$RUNNER_TEMP/gemini-cli-history-regression-control.log" 2>&1; then
            echo 'The native CLI history regression unexpectedly passed before repair.'
            exit 1
          fi
          grep -F 'AssertionError: A fresh native CLI must discover canonical conversation history.' "$RUNNER_TEMP/gemini-cli-history-regression-control.log"
      - name: Preserve coordinated native canonical reads and private-scope isolation
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --private-configs > "$RUNNER_TEMP/gemini-coordinated-reads.log" 2>&1
      - name: Preserve no-selector native behavior
        run: node --max-old-space-size=256 experiments/issue-3785/probe-gemini-native-reads.mjs --without-selector --expect-native-gaps > "$RUNNER_TEMP/gemini-legacy-reads.log" 2>&1
      - name: Apply exact pinned native conversation storage
        run: |
          python3 experiments/issue-3785/native-gemini/apply_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --check
          python3 experiments/issue-3785/native-gemini/apply_history.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli
      - name: Verify bounded history storage and independent concurrent writers
        run: python3 experiments/issue-3785/probe-gemini-native-history-storage.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --diagnostics "$RUNNER_TEMP/gemini-history-storage.log" > "$RUNNER_TEMP/gemini-history-storage-controls.log" 2>&1
      - name: Discover and resume actual CLI conversation after private home disposal
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --diagnostics "$RUNNER_TEMP/gemini-cli-history-after.log" > "$RUNNER_TEMP/gemini-cli-history-after-control.log" 2>&1
      - name: Refuse unsafe native history without modifying protected files
        run: |
          for link in symlink hardlink malformed truncated; do
            python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --history-attack "$link" --diagnostics "$RUNNER_TEMP/gemini-cli-history-$link.log" > "$RUNNER_TEMP/gemini-cli-history-$link-control.log" 2>&1
          done
      - name: Preserve unselected native private history behavior
        run: python3 experiments/issue-3785/probe-gemini-native-cli.py experiments/issue-3785/native-gemini/stock-cli/node_modules/@google/gemini-cli --history --private-history --expect-history-gap --diagnostics "$RUNNER_TEMP/gemini-cli-history-legacy.log" > "$RUNNER_TEMP/gemini-cli-history-legacy-control.log" 2>&1
      - name: Preserve native authentication after conversation storage admission
        run: |
          node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-writers.mjs > "$RUNNER_TEMP/gemini-history-auth-writers.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-request-auth.mjs > "$RUNNER_TEMP/gemini-history-auth-requests.log" 2>&1
          node --max-old-space-size=128 experiments/issue-3785/probe-gemini-native-reads.mjs --private-configs > "$RUNNER_TEMP/gemini-history-auth-reads.log" 2>&1
      - name: Preserve native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-gemini-auth-experiment
          path: |
            ${{ runner.temp }}/gemini-*.log
            ${{ runner.temp }}/gemini-*.network.json
          if-no-files-found: ignore
          retention-days: 7
