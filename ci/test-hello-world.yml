# Runs main.rs on every push and pull request with the commands the
# change was verified with.
name: Run main.rs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Rust
        run: |
          set -eu
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            rustup_bootstrap=$(mktemp)
            trap 'rm -f "$rustup_bootstrap"' EXIT
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --output "$rustup_bootstrap" https://sh.rustup.rs
            sh "$rustup_bootstrap" --no-modify-path --profile minimal --default-toolchain none -y
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - run: |
          sh tests/verify-output.sh
