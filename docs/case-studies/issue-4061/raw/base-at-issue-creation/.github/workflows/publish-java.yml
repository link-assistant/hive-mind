name: publish-java

on:
  workflow_call:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        required: false
        default: false
    secrets:
      CENTRAL_USERNAME:
        required: false
      CENTRAL_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: java

jobs:
  publishToMavenCentral:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    concurrency:
      group: ci-java-publish-maven-central
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version-check.outputs.version }}
      group: ${{ steps.version-check.outputs.group }}
      artifact: ${{ steps.version-check.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up JDK 27
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "27.0.1"
          distribution: "temurin"
          cache: maven
          server-id: central
          # setup-java v6 deprecated the unsuffixed names and warned about each
          # of them on every publish run (issue #330). Same values: these name
          # the environment variables that hold the secrets.
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Check if version already published
        id: version-check
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry-probe.sh
          . "$GITHUB_WORKSPACE/scripts/ci/registry-probe.sh"
          PACKAGE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          PACKAGE_GROUP=$(./mvnw help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          PACKAGE_ARTIFACT=$(./mvnw help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          {
            echo "version=$PACKAGE_VERSION"
            echo "group=$PACKAGE_GROUP"
            echo "artifact=$PACKAGE_ARTIFACT"
          } >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE_GROUP:$PACKAGE_ARTIFACT:$PACKAGE_VERSION"

          URL="https://repo1.maven.org/maven2/$(echo "$PACKAGE_GROUP" | tr '.' '/')/$PACKAGE_ARTIFACT/$PACKAGE_VERSION/$PACKAGE_ARTIFACT-$PACKAGE_VERSION.pom"
          if probe_registry "$URL"; then
            echo "Version $PACKAGE_VERSION already exists on Maven Central"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$REGISTRY_PROBE_STATUS" != "404" ]; then
              echo "::error::Registry presence is unknown (HTTP $REGISTRY_PROBE_STATUS); refusing publication"
              exit 1
            fi
            echo "Version $PACKAGE_VERSION does not exist on Maven Central"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Maven Central
        id: publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ "${{ steps.version-check.outputs.should_publish }}" != "true" ]; then
            echo "published=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${{ steps.version-check.outputs.version }} is already on Maven Central, nothing to publish"
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/scripts/ci/require-java-credentials.sh"
          ./mvnw -B deploy -Prelease --file pom.xml
          echo "published=true" >> "$GITHUB_OUTPUT"
      # `autoPublish` hands the bundle to the Portal, which validates and
      # syncs it asynchronously, so a successful `./mvnw deploy` is not yet a
      # published artifact. Nothing is released until it is really there.
      - name: Verify the artifact is really on Maven Central
        if: steps.publish.outputs.published == 'true' || steps.publish.outputs.published == 'skipped'
        env:
          PACKAGE_GROUP: ${{ steps.version-check.outputs.group }}
          PACKAGE_ARTIFACT: ${{ steps.version-check.outputs.artifact }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/ci/maven-central.mjs"
          bash "$GITHUB_WORKSPACE/scripts/ci/maven-consumer.sh" java "$PACKAGE_VERSION"

  publishRelease:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [publishToMavenCentral]
    # See csharp.yml: gate on what was published, not on the job result.
    if: ${{ (needs.publishToMavenCentral.outputs.published == 'true' || needs.publishToMavenCentral.outputs.published == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The version is taken from the publish job's output instead of being
      # re-evaluated with Maven, which needed a whole JDK just to read a
      # number that the previous job already knew.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          PACKAGE_GROUP: ${{ needs.publishToMavenCentral.outputs.group }}
          PACKAGE_ARTIFACT: ${{ needs.publishToMavenCentral.outputs.artifact }}
          PACKAGE_VERSION: ${{ needs.publishToMavenCentral.outputs.version }}
        run: |
          set -euo pipefail
          TAG="java_${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "[Java] $PACKAGE_VERSION" \
            --notes "https://central.sonatype.com/artifact/$PACKAGE_GROUP/$PACKAGE_ARTIFACT/$PACKAGE_VERSION"
